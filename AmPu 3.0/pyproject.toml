[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ampu"
version = "3.0.0"
description = "Laboratorio de probabilidad, estadística y muestreo"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Colaboradores de AmPu 3.0"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "Operating System :: OS Independent", "Topic :: Scientific/Engineering :: Mathematics"]
dependencies = [
    "PySide6>=6.7,<7",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "openpyxl>=3.1,<4",
    "reportlab>=4.2,<5",
    "Markdown>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "PyInstaller>=6.11,<7"]

[project.scripts]
ampu = "ampu.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ampu = ["docs/teoria/*.md", "docs/imagenes/*.png", "docs/render/*.html", "docs/render/*.js", "docs/render/*.css", "docs/render/fonts/*.woff2", "docs/render/LICENSE.katex", "docs/render/LICENSE.stix", "ui/estilos/*.qss", "ui/recursos/*.svg", "ui/recursos/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.*QFontDatabase.*:UserWarning"]

[tool.coverage.run]
source = ["ampu.core"]
branch = true

[tool.coverage.report]
exclude_also = ["raise NotImplementedError", "if TYPE_CHECKING:"]
