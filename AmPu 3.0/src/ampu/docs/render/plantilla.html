<!doctype html>
<html lang="es" data-tema="{{TEMA}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITULO}} · Teoría AmPu</title>
  <link rel="stylesheet" href="../render/katex.min.css">
  <style>
    @font-face {font-family:STIX;src:url('../render/fonts/stix-two-math-latin-400-normal.woff2') format('woff2');font-display:swap}
    :root {color-scheme:light;--fondo:#f4f7fb;--papel:#fff;--texto:#192c47;--muted:#465b73;--borde:#d8e2ec;--acento:#087c75;--codigo:#edf5f6;--sombra:0 6px 28px rgba(20,40,70,.06)}
    :root[data-tema="oscuro"]{color-scheme:dark;--fondo:#101b2d;--papel:#1b2940;--texto:#f0f5fc;--muted:#bacbdd;--borde:#3d516b;--acento:#7de9dc;--codigo:#263850;--sombra:none}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--fondo);color:var(--texto);font:17px/1.78 Georgia,STIX,serif}
    a{color:var(--acento);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
    .layout{display:grid;grid-template-columns:minmax(200px,242px) minmax(0,1fr);min-height:100vh}
    aside{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--borde);background:var(--papel);padding:26px 18px;font:14px/1.6 system-ui,sans-serif}
    aside .marca{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--acento);font-weight:800;margin:0 8px 12px}
    aside ul{padding-left:0;list-style:none}aside ul ul{padding-left:16px;margin:4px 0}aside li{margin:4px 0}aside a{display:block;padding:4px 8px;border-radius:7px;color:var(--muted)}aside a:hover{background:var(--codigo);color:var(--texto);text-decoration:none}
    main{min-width:0;padding:52px clamp(24px,5vw,88px) 84px}article{max-width:76ch;margin:auto;background:var(--papel);border:1px solid var(--borde);border-radius:18px;padding:clamp(26px,5vw,60px);box-shadow:var(--sombra)}
    h1,h2,h3{font-family:system-ui,-apple-system,sans-serif;line-height:1.3;letter-spacing:-.035em;scroll-margin-top:24px}h1{font-size:2.2em;margin:0 0 .7em}h2{font-size:1.34em;margin:2em 0 .6em;border-bottom:1px solid var(--borde);padding-bottom:.35em}h3{font-size:1.08em}
    p,li{color:var(--texto)}p{margin:1em 0}strong{font-weight:700}ul,ol{padding-left:1.45em}li{margin:.45em 0}
    .formula-bloque{position:relative;max-width:100%;overflow-x:auto;background:var(--codigo);border:1px solid var(--borde);border-radius:12px;padding:18px 24px;margin:1.5em 0;text-align:center}
    .formula-bloque .katex-display{margin:.3em 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}.formula-linea{white-space:nowrap}.katex{font-size:1.04em}
    .copiar{position:absolute;right:8px;top:6px;border:1px solid var(--borde);border-radius:7px;background:var(--papel);color:var(--texto);padding:5px 8px;font:11px system-ui;cursor:pointer;opacity:.8}.copiar:hover{opacity:1}
    table{border-collapse:collapse;width:100%;font:14px/1.6 system-ui,sans-serif;margin:22px 0;display:block;overflow-x:auto}th,td{padding:11px 14px;text-align:left;border:1px solid var(--borde);vertical-align:top}th{background:var(--codigo);color:var(--texto);font-weight:700}tr:nth-child(even) td{background:var(--codigo)}
    img{display:block;max-width:100%;height:auto;margin:24px auto 7px;border-radius:10px}img+p>em{display:block;text-align:center;font:13px system-ui;color:var(--muted)}code{background:var(--codigo);padding:2px 5px;border-radius:4px}
    .barra{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 16px;max-width:76ch;font:13px system-ui;color:var(--muted)}.barra button{border:1px solid var(--borde);border-radius:6px;background:var(--papel);color:var(--texto);padding:5px 10px;cursor:pointer}
    @media(max-width:790px){.layout{display:block}aside{position:static;height:auto;max-height:180px;border-right:0;border-bottom:1px solid var(--borde)}main{padding:22px 12px}article{padding:22px}}
    @media print{body{background:white;color:black}aside,.barra,.copiar{display:none!important}.layout{display:block}main{padding:0}article{border:0;box-shadow:none;max-width:none}}
  </style>
</head>
<body>
<div class="layout">
  <aside aria-label="Índice de contenidos"><p class="marca">AmPu · Teoría</p>{{INDICE}}</aside>
  <main>
    <div class="barra"><span>LECTURA · SIN CONEXIÓN</span><span><button id="menos" title="Ctrl + -">A−</button> <button id="mas" title="Ctrl + +">A+</button></span></div>
    <article id="contenido">{{ARTICULO}}</article>
  </main>
</div>
<script src="../render/katex.min.js"></script>
<script src="../render/auto-render.min.js"></script>
<script>
(function(){
  'use strict';
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(document.getElementById('contenido'), {
      delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false, strict:'warn', ignoredTags:['script','noscript','style','textarea','pre','code']
    });
  }
  document.querySelectorAll('.formula-bloque').forEach(function(b){
    var an=b.querySelector('annotation[encoding="application/x-tex"]');
    if(!an)return;
    var boton=document.createElement('button');boton.className='copiar';boton.textContent='Copiar LaTeX';boton.title='Copiar código LaTeX de esta fórmula';
    boton.onclick=function(){
      var campo=document.createElement('textarea');campo.value=an.textContent;document.body.appendChild(campo);
      campo.select();document.execCommand('copy');campo.remove();boton.textContent='Copiado';
      window.setTimeout(function(){boton.textContent='Copiar LaTeX'},1700);
    };
    b.appendChild(boton);
  });
  var zoom=1;
  function cambiar(delta){zoom=Math.max(.7,Math.min(1.8,zoom+delta));document.body.style.fontSize=(17*zoom)+'px'}
  document.getElementById('mas').onclick=function(){cambiar(.1)};
  document.getElementById('menos').onclick=function(){cambiar(-.1)};
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&(e.key==='+'||e.key==='='||e.key==='-')){cambiar(e.key==='-'?-.1:.1);e.preventDefault()}
  });
})();
</script>
</body>
</html>
